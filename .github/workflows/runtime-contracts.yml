name: Runtime Contracts

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  contracts:
    name: Runtime contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract test dependencies
        run: python -m pip install pytest

      - name: Run Manim runtime contract tests
        run: pytest -q modules/stock-manim-animation/python-manim/tests/test_render_all.py
