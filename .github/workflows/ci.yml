name: CI Post-Merge Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Lint, Test, Python Runtime & Artifact Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            modules/feature-selection/python-reference/requirements.txt
            modules/agri-weather-dashboard/python-reference/requirements.txt
            modules/django-blog/python-reference/requirements.txt

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn==1.9.0
          python -m pip install -r modules/agri-weather-dashboard/python-reference/requirements.txt
          python -m pip install -r modules/django-blog/python-reference/requirements.txt

      - name: Rebuild and Verify ML Artifacts
        run: python scripts/verify_artifacts_reproducible.py

      - name: Rebuild and Verify Django Artifacts
        run: |
          python modules/django-blog/scripts/export_django_artifacts.py
          git diff --exit-code -- modules/django-blog/artifacts

      - name: Validate FastAPI Source Runtime
        run: |
          python -m compileall modules/agri-weather-dashboard/python-reference
          cd modules/agri-weather-dashboard/python-reference
          PYTHONPATH=. pytest -q

      - name: Validate Django Source Runtime
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: |
          cd modules/django-blog/python-reference
          python -m compileall .
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Type Check
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee typescript-diagnostic.txt

      - name: Upload TypeScript Diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostic
          path: typescript-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Run Automated Tests
        run: npm run test

      - name: Build Next.js Application
        run: npm run build
