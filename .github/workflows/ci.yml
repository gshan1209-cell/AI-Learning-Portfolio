name: CI Post-Merge Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Lint, Test & Artifact Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/feature-selection/python-reference/requirements.txt

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Artifact Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn==1.9.0

      - name: Rebuild and Verify ML Artifacts
        run: python scripts/verify_artifacts_reproducible.py

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Automated Tests
        run: npm run test

      - name: Build Next.js Application
        run: npm run build
