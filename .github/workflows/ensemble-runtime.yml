name: Ensemble Runtime Training

on:
  pull_request:
    branches: [ main ]
    paths:
      - "modules/ensemble-income-predictor/**"
      - "api/_ensemble_runtime.py"
      - "api/ensemble-predict.py"
      - "requirements.txt"
      - ".github/workflows/ensemble-runtime.yml"
  push:
    branches: [ main ]
    paths:
      - "modules/ensemble-income-predictor/**"
      - "api/_ensemble_runtime.py"
      - "api/ensemble-predict.py"
      - "requirements.txt"
      - ".github/workflows/ensemble-runtime.yml"
  workflow_dispatch:

jobs:
  train-and-verify:
    name: Retrain, evaluate and exercise deployed model
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Retrain five Adult Census classifiers
        run: |
          python modules/ensemble-income-predictor/scripts/train_model.py \
            --output-dir modules/ensemble-income-predictor/runtime-artifacts \
            --dataset-cache modules/ensemble-income-predictor/data/adult.data

      - name: Validate training and fairness artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("modules/ensemble-income-predictor/runtime-artifacts")
          report = json.loads((root / "training_report.json").read_text(encoding="utf-8"))
          assert report["meta"]["records"] > 30_000, report["meta"]
          assert report["meta"]["features"] == 14, report["meta"]
          assert report["meta"]["modelSha256"], report["meta"]
          assert len(report["metrics"]) == 5, report["metrics"].keys()
          assert report["metrics"]["RandomForest"]["f1"] > 0.5
          assert report["fairness"]["groups"]["sex"]
          assert report["fairness"]["groups"]["race"]
          assert len(report["fixturePredictions"]) == 3
          for path in [
              root / "adult_income_pipeline.joblib",
              root / "model_meta.json",
              root / "metrics.json",
              root / "fairness.json",
              root / "fixture_predictions.json",
          ]:
              assert path.exists() and path.stat().st_size > 0, path
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Download and exercise pinned deployed model
        env:
          PYTHONPATH: api
        run: |
          python - <<'PY'
          import json
          from _ensemble_runtime import EXPECTED_GIT_BLOB_SHA, download_model_bytes, git_blob_sha, predict

          model_bytes = download_model_bytes()
          assert git_blob_sha(model_bytes) == EXPECTED_GIT_BLOB_SHA
          result = predict({
              "age": 39,
              "workclass": "Private",
              "education": "Bachelors",
              "marital_status": "Never-married",
              "occupation": "Adm-clerical",
              "relationship": "Not-in-family",
              "race": "White",
              "sex": "Male",
              "capital_gain": 2174,
              "capital_loss": 0,
              "hours_per_week": 40,
              "native_country": "United-States"
          })
          assert result["prediction"] in {"<=50K", ">50K"}, result
          assert 0 <= result["probability"] <= 1, result
          assert len(result["modelSha256"]) == 64, result
          assert "高風險" in result["disclaimer"], result
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload reproducible training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ensemble-income-runtime-artifacts
          path: modules/ensemble-income-predictor/runtime-artifacts/**
          if-no-files-found: error
          retention-days: 14
